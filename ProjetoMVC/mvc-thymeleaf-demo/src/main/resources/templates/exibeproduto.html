<!DOCTYPE html>
<html xmlns="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Produto</title>
  <style>
      table {
        width: 50%;
        border-collapse: collapse;
        margin: 20px 0px;
      }
      th, td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #f2f2f2;
      }
  </style>
</head>
<body>

  <h1>Produto</h1>

  <table>
    <thead>
      <tr>
        <th>Atributo</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Nome</td>
        <td td:text="${prod.nome}"></td>
      </tr>
      <tr>
        <td>Preço</td>
        <td td:text="${prod.preco}"></td>
      </tr>
    </tbody>
  </table>
  
</body>
</html>
